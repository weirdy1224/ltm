<div class="container fade-in">
  <div class="error-card glass-card">
    <div class="error-code-badge">{{ errorCode }}</div>
    <h1 class="error-title">Oops! Something went wrong</h1>
    <p class="error-text">{{ errorMessage }}</p>
    <div class="error-actions">
      <a routerLink="/" class="btn btn-gold"><i class="fa-solid fa-house"></i> Return to Home</a>
      <a routerLink="/login" class="btn btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Back to Login</a>
    </div>
  </div>
</div>
